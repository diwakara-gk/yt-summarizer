<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Transcript Summarizer</title>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root{color-scheme:dark;--bg:#0b0d12;--card:#161a23;--text:#f1f3f9;--muted:#b4bacb;--border:#343b4d;--accent:#818cf8;--accent-h:#a5b4fc;--err:#fca5a5;--errbg:#2a1517}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  header{padding:2.5rem 1rem 1rem;text-align:center}
  header h1{margin:0 0 .3rem;font-size:1.9rem;letter-spacing:-.02em}
  main{max-width:1100px;width:94%;margin:0 auto;padding:1rem 1rem 4rem}
  .card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:1.25rem;margin-bottom:1.25rem}
  label{display:block;font-weight:600;margin-bottom:.4rem}
  input,textarea{width:100%;padding:.8rem 1rem;font-size:1rem;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;resize:vertical}
  input:focus,textarea:focus{outline:2px solid var(--accent);border-color:transparent}
  button{margin-top:.8rem;padding:.8rem 1.3rem;font-size:1rem;font-weight:600;border:0;border-radius:10px;background:var(--accent);color:#0f1117;cursor:pointer}
  button:hover:not(:disabled){background:var(--accent-h)}
  button:disabled{opacity:.6;cursor:not-allowed}
  #status{margin:.9rem 0 0;color:var(--muted);min-height:1.5rem}
  #status.err{color:var(--err);background:var(--errbg);padding:.6rem .8rem;border-radius:8px}
  .hidden{display:none}
  .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .result-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem}
  .result-head label{margin:0}
  .ghost-btn{margin:0;padding:.45rem .9rem;font-size:.85rem;font-weight:600;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);cursor:pointer}
  .ghost-btn:hover{border-color:var(--accent);color:var(--accent-h)}
  #result{padding:1.75rem 2rem}
  #summary{line-height:1.75;font-size:1.05rem;overflow-wrap:anywhere;min-height:12rem}
  #summary h2{font-size:1.3rem;margin:1.8rem 0 .7rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
  #summary h2:first-child{margin-top:0}
  #summary h3{font-size:1.1rem;margin:1.2rem 0 .5rem;color:var(--accent-h)}
  #summary p{margin:.6rem 0}
  #summary ul,#summary ol{margin:.5rem 0;padding-left:1.5rem}
  #summary li{margin:.4rem 0}
  #summary li>ul,#summary li>ol{margin:.4rem 0}
  #summary strong{color:#fff}
  #summary hr{border:0;border-top:1px solid var(--border);margin:1.4rem 0}
  #summary code{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:.1rem .35rem;font-size:.9em}
  #summary a{color:var(--accent-h)}
  #raw{width:100%;margin-top:.75rem}
</style>
</head>
<body>
<header>
  <h1>Transcript Summarizer</h1>
</header>
<main>
  <section class="card">
    <form id="appForm" autocomplete="on">
      <!-- Dummy username field: tricks Chrome's password manager into treating the
           lone API-key field below as a saveable/autofillable credential. -->
      <input type="text" name="username" value="gemini-api-key" autocomplete="username" class="visually-hidden" tabindex="-1" aria-hidden="true">

      <label for="token">API token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" placeholder="Paste your Gemini API key">

      <label for="ptext" style="margin-top:1rem">Transcript</label>
      <textarea id="ptext" name="transcript" autocomplete="off" rows="4" placeholder="Paste the transcript here"></textarea>

      <button id="go" type="submit">Summarize</button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </section>

  <section id="result" class="card hidden">
    <div class="result-head">
      <label>Summary</label>
      <div style="display:flex;gap:.5rem">
        <button id="copyBtn" type="button" class="ghost-btn">Copy Markdown</button>
        <button id="toggleRaw" type="button" class="ghost-btn">View Raw</button>
      </div>
    </div>
    <div id="summary"></div>
    <textarea id="raw" rows="22" readonly class="hidden"></textarea>
  </section>
</main>
<script>
const $ = id => document.getElementById(id);

function setStatus(msg, err) {
  const s = $('status');
  s.className = err ? 'err' : '';
  s.textContent = msg || '';
}

async function run() {
  const transcript = $('ptext').value.trim();
  const token = $('token').value.trim();
  if (!token) return setStatus('Please enter your API token.', true);
  if (!transcript) return setStatus('Please paste a transcript.', true);

  $('go').disabled = true;
  $('result').classList.add('hidden');
  setStatus('Summarizing...');

  try {
    const r = await fetch('/api/summarize', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({transcript, token})
    });
    const text = await r.text();
    let d;
    try { d = JSON.parse(text); } catch { throw new Error(r.status === 504 ? 'The request timed out. Try again or use a shorter transcript.' : `Server error (${r.status})`); }
    if (!r.ok) throw new Error(d.error || r.statusText);
    renderSummary(d.summary);
    $('result').classList.remove('hidden');
    setStatus('');
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    $('go').disabled = false;
  }
}

function renderSummary(markdown) {
  $('raw').value = markdown;
  const html = marked.parse(markdown, { headerIds: false, mangle: false });
  $('summary').innerHTML = DOMPurify.sanitize(html);
  $('summary').classList.remove('hidden');
  $('raw').classList.add('hidden');
  $('toggleRaw').textContent = 'View Raw';
}

$('toggleRaw').addEventListener('click', () => {
  const switchingToRaw = $('raw').classList.contains('hidden');
  $('raw').classList.toggle('hidden', !switchingToRaw);
  $('summary').classList.toggle('hidden', switchingToRaw);
  $('toggleRaw').textContent = switchingToRaw ? 'View Rendered' : 'View Raw';
});

$('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText($('raw').value);
    const old = $('copyBtn').textContent;
    $('copyBtn').textContent = 'Copied!';
    setTimeout(() => { $('copyBtn').textContent = old; }, 1500);
  } catch {
    setStatus('Could not copy to clipboard.', true);
  }
});

$('appForm').addEventListener('submit', e => { e.preventDefault(); run(); });
</script>
</body>
</html>
