<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>&#9889; YouTube Transcript Summarizer</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='80'%3E%F0%9F%93%9D%3C/text%3E%3C/svg%3E">
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
  :root{color-scheme:dark;--bg:#0a0c11;--card:#161a23;--card-soft:#131722;--text:#f1f3f9;--muted:#9aa1b5;--border:#2d3346;--accent:#818cf8;--accent-h:#a5b4fc;--accent2:#34d7c3;--err:#fca5a5;--errbg:#2a1517;--shadow:0 16px 40px -20px rgba(0,0,0,.6)}
  *{box-sizing:border-box}
  html{scrollbar-color:var(--border) transparent}
  ::-webkit-scrollbar{width:10px;height:10px}
  ::-webkit-scrollbar-track{background:transparent}
  ::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px}
  ::-webkit-scrollbar-thumb:hover{background:var(--accent)}
  body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font:16px/1.6 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;position:relative;overflow-x:hidden}
  body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(90px);pointer-events:none;z-index:0}
  body::before{width:36rem;height:36rem;top:-14rem;left:-10rem;background:radial-gradient(circle,rgba(129,140,248,.22),transparent 70%)}
  body::after{width:34rem;height:34rem;bottom:-14rem;right:-10rem;background:radial-gradient(circle,rgba(52,215,195,.14),transparent 70%)}
  header,main{position:relative;z-index:1}
  header{padding:3rem 1rem 1.25rem;text-align:center}
  .badge{display:inline-flex;align-items:center;justify-content:center;width:3.2rem;height:3.2rem;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:1.5rem;margin-bottom:.9rem;box-shadow:0 8px 24px -8px rgba(129,140,248,.6)}
  header h1{margin:0 0 .4rem;font-size:2.1rem;letter-spacing:-.02em;background:linear-gradient(135deg,#fff,var(--accent-h) 60%,var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  header p{margin:0;color:var(--muted);font-size:.95rem}
  main{max-width:1100px;width:94%;margin:0 auto;padding:1rem 1rem 4rem}
  .card{background:linear-gradient(180deg,var(--card),var(--card-soft));border:1px solid var(--border);border-radius:16px;padding:1.4rem;margin-bottom:1.25rem;box-shadow:var(--shadow)}
  label{display:block;font-weight:600;margin-bottom:.4rem}
  input,textarea{width:100%;padding:.8rem 1rem;font-size:1rem;border:1px solid var(--border);border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;resize:vertical;transition:border-color .15s,box-shadow .15s}
  input:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(129,140,248,.25)}
  button{margin-top:.9rem;padding:.8rem 1.4rem;font-size:1rem;font-weight:700;border:0;border-radius:10px;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#0f1117;cursor:pointer;display:inline-flex;align-items:center;gap:.55rem;transition:transform .12s,box-shadow .12s,opacity .12s;box-shadow:0 10px 24px -10px rgba(129,140,248,.55)}
  button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 14px 28px -10px rgba(129,140,248,.7)}
  button:active:not(:disabled){transform:translateY(0)}
  button:disabled{opacity:.65;cursor:not-allowed;box-shadow:none}
  .spinner{width:.95rem;height:.95rem;border:2px solid rgba(15,17,23,.35);border-top-color:#0f1117;border-radius:50%;animation:spin .7s linear infinite;display:none}
  button:disabled .spinner{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  #status{margin:.9rem 0 0;color:var(--muted);min-height:1.5rem}
  #status.err{color:var(--err);background:var(--errbg);padding:.6rem .8rem;border-radius:8px}
  .hidden{display:none}
  .visually-hidden{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
  .result-head{display:flex;align-items:center;justify-content:space-between;gap:.75rem;margin-bottom:.75rem;padding-bottom:.9rem;border-bottom:1px solid var(--border)}
  .result-head label{margin:0;font-size:1.05rem}
  .ghost-btn{margin:0;padding:.45rem .9rem;font-size:.85rem;font-weight:600;border:1px solid var(--border);border-radius:8px;background:transparent;color:var(--text);cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .ghost-btn:hover{border-color:var(--accent);color:var(--accent-h);background:rgba(129,140,248,.1)}
  #result{padding:1.75rem 2rem;border:1px solid rgba(129,140,248,.25)}
  #result.show{animation:rise .45s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:.85rem;padding:0 1rem 2.5rem}
  #summary{line-height:1.75;font-size:1.05rem;overflow-wrap:anywhere;min-height:12rem}
  #summary h2{font-size:1.3rem;margin:1.8rem 0 .7rem;padding-bottom:.4rem;border-bottom:1px solid var(--border)}
  #summary h2:first-child{margin-top:0}
  #summary h3{font-size:1.1rem;margin:1.2rem 0 .5rem;color:var(--accent-h)}
  #summary p{margin:.6rem 0}
  #summary ul,#summary ol{margin:.5rem 0;padding-left:1.5rem}
  #summary li{margin:.4rem 0}
  #summary li>ul,#summary li>ol{margin:.4rem 0}
  #summary strong{color:#fff}
  #summary hr{border:0;border-top:1px solid var(--border);margin:1.4rem 0}
  #summary code{background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:.1rem .35rem;font-size:.9em}
  #summary a{color:var(--accent-h)}
  #raw{width:100%;margin-top:.75rem}
</style>
</head>
<body>
<header>
  <div class="badge" aria-hidden="true">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M12 2L14.5 8.5L21 11L14.5 13.5L12 20L9.5 13.5L3 11L9.5 8.5L12 2Z" fill="#0f1117"/>
    </svg>
  </div>
  <h1>&#9889; YouTube Transcript Summarizer &#9889;</h1>
  <p>Paste a token and a transcript — get a clean, structured summary back.</p>
</header>
<main>
  <section class="card">
    <form id="appForm" autocomplete="on">
      <!-- Dummy username field: tricks Chrome's password manager into treating the
           lone API-key field below as a saveable/autofillable credential. -->
      <input type="text" name="username" value="gemini-api-key" autocomplete="username" class="visually-hidden" tabindex="-1" aria-hidden="true">

      <label for="token">API token</label>
      <input id="token" name="token" type="password" autocomplete="current-password" placeholder="Paste your Gemini API key">

      <label for="ptext" style="margin-top:1rem">Transcript</label>
      <textarea id="ptext" name="transcript" autocomplete="off" rows="4" placeholder="Paste the transcript here"></textarea>

      <button id="go" type="submit"><span class="spinner" aria-hidden="true"></span><span id="goLabel">Summarize</span></button>
      <div id="status" role="status" aria-live="polite"></div>
    </form>
  </section>

  <section id="result" class="card hidden">
    <div class="result-head">
      <label>Summary</label>
      <div style="display:flex;gap:.5rem">
        <button id="copyBtn" type="button" class="ghost-btn">Copy Markdown</button>
        <button id="toggleRaw" type="button" class="ghost-btn">View Raw</button>
      </div>
    </div>
    <div id="summary"></div>
    <textarea id="raw" rows="22" readonly class="hidden"></textarea>
  </section>
</main>
<footer>Made by Macy the code pup &middot; your transcript and key stay in your browser</footer>
<script>
const $ = id => document.getElementById(id);

function setStatus(msg, err) {
  const s = $('status');
  s.className = err ? 'err' : '';
  s.textContent = msg || '';
}

async function run() {
  const transcript = $('ptext').value.trim();
  const token = $('token').value.trim();
  if (!token) return setStatus('Please enter your API token.', true);
  if (!transcript) return setStatus('Please paste a transcript.', true);

  $('go').disabled = true;
  $('goLabel').textContent = 'Summarizing...';
  $('result').classList.add('hidden');
  setStatus('Summarizing...');

  try {
    const r = await fetch('/api/summarize', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({transcript, token})
    });
    const text = await r.text();
    let d;
    try { d = JSON.parse(text); } catch { throw new Error(r.status === 504 ? 'The request timed out. Try again or use a shorter transcript.' : `Server error (${r.status})`); }
    if (!r.ok) throw new Error(d.error || r.statusText);
    renderSummary(d.summary);
    $('result').classList.remove('hidden');
    $('result').classList.add('show');
    setStatus('');
  } catch (e) {
    setStatus(e.message, true);
  } finally {
    $('go').disabled = false;
    $('goLabel').textContent = 'Summarize';
  }
}

function renderSummary(markdown) {
  $('raw').value = markdown;
  const html = marked.parse(markdown, { headerIds: false, mangle: false });
  $('summary').innerHTML = DOMPurify.sanitize(html);
  $('summary').classList.remove('hidden');
  $('raw').classList.add('hidden');
  $('toggleRaw').textContent = 'View Raw';
}

$('toggleRaw').addEventListener('click', () => {
  const switchingToRaw = $('raw').classList.contains('hidden');
  $('raw').classList.toggle('hidden', !switchingToRaw);
  $('summary').classList.toggle('hidden', switchingToRaw);
  $('toggleRaw').textContent = switchingToRaw ? 'View Rendered' : 'View Raw';
});

$('copyBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText($('raw').value);
    const old = $('copyBtn').textContent;
    $('copyBtn').textContent = 'Copied!';
    setTimeout(() => { $('copyBtn').textContent = old; }, 1500);
  } catch {
    setStatus('Could not copy to clipboard.', true);
  }
});

$('appForm').addEventListener('submit', e => { e.preventDefault(); run(); });
</script>
</body>
</html>
